<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | THE FIRST CHAPTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-login-body">
    <div class="login-card">
        <h1>Admin Portal</h1>
        <p>THE FIRST CHAPTER 2026</p>
        
        <form id="login-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="admin@example.com" value="mizanurrahman01x@gmail.com" readonly>
                <!-- Note: Readonly prevents others from trying other emails, ensuring only your account logs in. -->
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
            <p id="login-error" class="error-msg hidden" style="text-align:center; margin-top:1rem;"></p>
        </form>
    </div>
    <script type="module" src="../js/admin-login.js"></script>
</body>
</html>
